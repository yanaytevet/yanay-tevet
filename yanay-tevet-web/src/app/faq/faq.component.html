<div class="max-w-2xl mx-auto px-6 py-20">

  <h1 class="text-hero font-bold text-writing leading-tight mb-3">
    Frequently asked questions
  </h1>
  <p class="text-lead text-writing-minor mb-12">
    What this place is and how to get in.
  </p>

  <div class="flex flex-col gap-0">
    @for (item of items; track item.question; let i = $index) {

      <div class="border-b border-line">
        <button
          type="button"
          class="w-full flex items-center justify-between gap-4 py-5 text-left cursor-pointer bg-transparent border-none"
          (click)="toggle(i)"
        >
          <span class="text-lead font-500 text-writing leading-snug">{{ item.question }}</span>
          <span class="text-writing-least flex-shrink-0 transition-transform duration-200"
                [class.rotate-180]="openIndex() === i">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </button>
        @if (openIndex() === i) {
          <p class="text-ui text-writing-minor leading-relaxed pb-5 mt-[-4px]">
            {{ item.answer }}
          </p>
        }
      </div>
    }
  </div>

  <div class="mt-16 pt-8 border-t border-line text-center">
    <p class="text-ui font-medium text-writing mb-1">Something else on your mind?</p>
    <p class="text-body text-writing-minor">
      Drop me a line at
      <a [href]="'mailto:' + supportEmail" class="text-accent hover:underline">{{ supportEmail }}</a>
    </p>
  </div>

</div>
