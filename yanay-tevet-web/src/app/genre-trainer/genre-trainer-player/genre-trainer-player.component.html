<div class="card overflow-hidden">

  <div
    class="relative group"
    style="height: 200px; background: #040414;"
    [class.cursor-pointer]="!service.isLoading()"
    (click)="onCanvasClick()">
    <canvas #vizCanvas class="w-full h-full block"></canvas>
    @if (audio.isPlaying()) {
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        <p class="text-white/60 text-body font-medium">Click to stop</p>
      </div>
    }
    @if (!audio.isPlaying() && !service.isLoading()) {
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        @if (service.playDisabled()) {
          <p class="text-white/40 text-body font-medium">{{ service.playDisabledMessage() }}</p>
        } @else {
          <p class="text-white/30 text-body font-medium">Press Play to start</p>
        }
      </div>
    }
    @if (service.isLoading()) {
      <div class="absolute inset-0 flex items-center justify-center">
        <p class="text-white/40 text-body">Loading track...</p>
      </div>
    }
  </div>

  <div class="px-4 py-3 flex items-center gap-3 border-t border-line">

    <!-- Auto-start toggle -->
    <button
      type="button"
      [attr.aria-pressed]="service.autoStart()"
      (click)="toggleAutoStart()"
      class="flex items-center gap-1.5 rounded-md text-caption font-medium text-writing-minor hover:text-writing transition-colors flex-shrink-0">
      <span
        class="relative w-7 h-3.5 rounded-full transition-colors duration-200"
        [class]="service.autoStart() ? 'bg-accent' : 'bg-layer-4'">
        <span
          class="absolute top-0.5 w-2.5 h-2.5 rounded-full shadow-sm transition-all duration-200"
          [class]="service.autoStart() ? 'bg-on-accent' : 'bg-writing-minor'"
          [style.left]="service.autoStart() ? '15px' : '2px'">
        </span>
      </span>
      Auto
    </button>

    <!-- Volume slider -->
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <span class="hidden sm:flex flex-shrink-0">
        <ng-icon [svg]="bootstrapVolumeDownFill" class="text-writing-minor text-base" />
      </span>
      <input
        type="range"
        min="0"
        max="1"
        step="0.01"
        class="flex-1 h-1 rounded-full cursor-pointer"
        [value]="audio.volume()"
        (input)="setVolume(+$any($event.target).value)">
      <span class="hidden sm:flex flex-shrink-0">
        <ng-icon [svg]="bootstrapVolumeUpFill" class="text-writing-minor text-base" />
      </span>
    </div>

    <!-- Play / Stop -->
    <button
      type="button"
      class="btn btn-primary px-5 flex-shrink-0 text-body"
      [disabled]="service.isLoading() || service.playDisabled() || audio.isRendering()"
      (click)="togglePlay()">
      @if (audio.isPlaying()) { Stop } @else { Play }
    </button>

    <!-- Admin: Download JSON -->
    @if (isAdmin()) {
      <button
        type="button"
        class="icon-btn"
        aria-label="Download track JSON"
        title="Download track JSON (admin)"
        [disabled]="!service.activeTrack() || audio.isRendering()"
        (click)="downloadJson()">
        <ng-icon [svg]="bootstrapDownload" class="text-base" />
      </button>

      <!-- Admin: Download audio (renders 2 loops to WAV) -->
      <button
        type="button"
        class="icon-btn"
        aria-label="Download track audio"
        title="Download track audio as WAV (admin)"
        [disabled]="!service.activeTrack() || audio.isRendering()"
        (click)="downloadAudio()">
        @if (audio.isRendering()) {
          <span class="inline-block size-4 rounded-full bg-danger animate-pulse" aria-hidden="true"></span>
        } @else {
          <ng-icon [svg]="bootstrapFileMusic" class="text-base" />
        }
      </button>
    }

    <!-- Settings -->
    <button
      type="button"
      class="icon-btn"
      aria-label="Training settings"
      title="Training settings"
      (click)="openConfig()">
      <ng-icon [svg]="bootstrapGearFill" class="text-base" />
    </button>

  </div>

</div>
