<div class="page-narrow">

  <app-page-header title="Genre Trainer" subtitle="Listen and identify the electronic music genre">
    @if (service.totalAnswered() > 0) {
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center">
          <span class="text-section font-bold text-writing tabular-nums">{{ service.streak() }}</span>
          <span class="text-caption text-writing-minor">Streak</span>
        </div>
        <div class="w-px h-8 bg-line" aria-hidden="true"></div>
        <div class="flex flex-col items-center">
          <span class="text-section font-bold text-writing tabular-nums">{{ service.totalCorrect() }}/{{ service.totalAnswered() }}</span>
          <span class="text-caption text-writing-minor">Correct</span>
        </div>
      </div>
    }
  </app-page-header>

  <app-genre-trainer-player />

  @if (service.error()) {
    <div class="mt-4 p-4 rounded-xl text-body text-danger bg-danger-soft">
      {{ service.error() }}
    </div>
  }

  @if (service.revealed()) {
    <div class="mt-4 flex justify-center">
      <button type="button" class="btn btn-primary px-8" (click)="onNextTrack()">
        Next Track
      </button>
    </div>
  }

  <app-genre-trainer-guess />
  <app-genre-trainer-reveal />

</div>
