@if (service.genres().length > 0) {
  <div class="mt-5 card p-4">
    <div class="eyebrow mb-3">Train on</div>
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        class="chip px-3 py-1"
        [class.chip-selected]="service.noFocus()"
        (click)="service.clearFocus()">
        All
      </button>
      @for (genre of service.genres(); track genre) {
        <button
          type="button"
          class="chip px-3 py-1"
          [class.chip-selected]="service.focusGenreState()[genre]"
          (click)="service.toggleFocusGenre(genre)">
          {{ service.genreLabelMap()[genre] }}
        </button>
      }
    </div>
  </div>
}
