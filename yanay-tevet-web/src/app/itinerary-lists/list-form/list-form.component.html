<div class="max-w-2xl mx-auto w-full p-6">

    <a [routerLink]="backUrl()"
       class="inline-flex items-center gap-1.5 text-meta text-writing-minor no-underline hover:text-writing transition-colors mb-4">
        <ng-icon [svg]="featherArrowLeft" class="h-4 w-4"></ng-icon>
        Back
    </a>

    <div class="card p-6">
        <div class="mb-6">
            <h1 class="text-title font-bold text-writing mb-1">
                {{ isEditMode() ? 'Edit List' : 'Create List' }}
            </h1>
            <p class="text-meta text-writing-minor">A reusable list of things to pack and prepare for a trip or outing.</p>
        </div>

        @if (isLoading()) {
            <div class="text-center text-writing-minor text-body py-12">Loading list...</div>
        } @else if (loadError()) {
            <div class="text-center py-12">
                <p class="text-body text-writing-minor mb-4">{{ loadError() }}</p>
                <button type="button" class="btn btn-secondary" (click)="onCancel()">Back</button>
            </div>
        } @else {
            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">Name <span class="text-writing-least">*</span></span>
                <input type="text" dir="auto" class="main-input w-full" placeholder="e.g. Beach day, Camping trip"
                       [formControl]="nameCtrl" (keyup.enter)="onSave()" />
            </div>

            <div class="mb-6 flex flex-col gap-1.5">
                <span class="input-label">Description</span>
                <textarea dir="auto" class="main-input w-full leading-relaxed" rows="4"
                          placeholder="What is this list for? Any notes..."
                          [formControl]="descriptionCtrl"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2 pt-4 border-t border-line-subtle">
                <button type="button" class="btn btn-secondary" [disabled]="isSaving()" (click)="onCancel()">Cancel</button>
                <button type="button" class="btn btn-primary" [disabled]="!canSave()" (click)="onSave()">
                    {{ isSaving() ? 'Saving...' : (isEditMode() ? 'Save Changes' : 'Create List') }}
                </button>
            </div>
        }
    </div>
</div>
