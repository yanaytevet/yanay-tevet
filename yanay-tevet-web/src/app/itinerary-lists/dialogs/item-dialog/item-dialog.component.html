<div class="dialog-container w-full">

    <div class="flex items-start justify-between mb-5">
        <h2 class="text-section font-bold text-writing">{{ data.title }}</h2>
        <button type="button" class="icon-btn -me-1.5 -mt-1" [attr.aria-label]="t().dialog.close" (click)="onClose()">
            <ng-icon [svg]="featherX" class="text-heading"></ng-icon>
        </button>
    </div>

    <div class="mb-4 flex flex-col gap-1.5">
        <span class="input-label">{{ t().dialog.name }} <span class="text-writing-least">*</span></span>
        <input type="text" class="main-input w-full" [placeholder]="isTask ? t().dialog.taskPlaceholder : t().dialog.itemPlaceholder" dir="auto"
               [formControl]="nameCtrl" (keyup.enter)="onSave()" />
    </div>

    <div class="mb-2 flex flex-col gap-1.5">
        <span class="input-label">{{ t().dialog.description }}</span>
        <textarea class="main-input w-full leading-relaxed" rows="3" dir="auto"
                  [placeholder]="isTask ? t().dialog.taskNotesPlaceholder : t().dialog.itemNotesPlaceholder"
                  [formControl]="descriptionCtrl"></textarea>
    </div>

    <div class="flex items-center justify-end gap-2 mt-6">
        <button type="button" class="btn btn-secondary" (click)="onClose()">{{ t().cancel }}</button>
        <button type="button" class="btn btn-primary" [disabled]="!canSave()" (click)="onSave()">
            {{ data.confirmActionName }}
        </button>
    </div>
</div>
