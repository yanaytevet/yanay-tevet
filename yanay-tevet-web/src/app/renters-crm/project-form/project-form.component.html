<div class="page-wide">

    <a [routerLink]="backUrl()"
       class="inline-flex items-center gap-1.5 rounded-md text-meta text-writing-minor no-underline hover:text-writing transition-colors mb-4">
        <ng-icon [svg]="featherArrowLeft"/>
        Back
    </a>

    <app-page-header [title]="isEditMode() ? 'Edit project' : 'New project'"
                     subtitle="A project groups the renters who came to see one apartment."/>

    @if (isLoading()) {
        <app-loading-state label="Loading project"/>
    } @else if (loadError()) {
        <app-error-state [text]="loadError()!" [backUrl]="backUrl()"/>
    } @else {
        <div class="card p-5 sm:p-6">
            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">Name <span class="text-writing-least">*</span></span>
                <input type="text" dir="auto" class="main-input" placeholder="e.g. Allenby 12 — 2nd floor"
                       aria-label="Name"
                       [formControl]="nameCtrl"/>
            </div>

            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">Description</span>
                <textarea dir="auto" class="main-input leading-relaxed" rows="4"
                          aria-label="Description"
                          placeholder="The apartment you're renting out, terms, must-haves for a renter…"
                          [formControl]="descriptionCtrl"></textarea>
            </div>

            <div class="grid grid-cols-1 @md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1.5">
                    <span class="input-label">Currency</span>
                    <select class="main-input" aria-label="Currency" [formControl]="currencyCtrl">
                        @for (currency of currencyOptions; track currency) {
                            <option [value]="currency">{{ currencyLabels[currency] }}</option>
                        }
                    </select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <span class="input-label">Initial asked rent (monthly)</span>
                    <input type="number" min="0" dir="auto" class="main-input"
                           aria-label="Initial asked rent (monthly)"
                           [formControl]="initialAskedRentCtrl"/>
                </div>
            </div>

            <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-line-subtle">
                <button type="button" class="btn btn-secondary" [disabled]="isSaving()" (click)="onCancel()">Cancel</button>
                <button type="button" class="btn btn-primary" [disabled]="!canSave()" (click)="onSave()">
                    {{ isSaving() ? 'Saving…' : (isEditMode() ? 'Save changes' : 'Create project') }}
                </button>
            </div>
        </div>
    }
</div>
