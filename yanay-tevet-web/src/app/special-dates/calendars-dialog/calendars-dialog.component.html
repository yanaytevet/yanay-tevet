<div class="dialog-container w-full max-h-[90vh] overflow-y-auto" dir="rtl" lang="he">

    <div class="flex items-start justify-between mb-5">
        <h2 class="text-section font-bold text-writing">הלוחות שלי</h2>
        <button type="button" class="icon-btn -me-1.5 -mt-1" aria-label="סגירה" (click)="onClose()">
            <ng-icon [svg]="featherX" class="text-heading"/>
        </button>
    </div>

    @if (isLoading()) {
        <app-loading-state label="טוען"/>
    } @else {
        <div class="flex flex-col gap-3">
            @for (row of rows(); track row.calendar.id) {
                <div class="rounded-lg border border-line p-3 {{ row.colorClass }}">
                    <div class="flex items-center gap-2">
                        <span class="calendar-dot size-3 rounded-full shrink-0"></span>
                        <div class="flex-1 min-w-0">
                            <div class="text-ui font-semibold text-writing truncate" dir="auto">{{ row.calendar.name }}</div>
                            <div class="text-caption text-writing-minor truncate">{{ row.subtitle }}</div>
                        </div>
                        @if (row.calendar.is_owner) {
                            <button type="button" class="btn btn-primary btn-sm shrink-0" (click)="share(row.calendar)">
                                <ng-icon [svg]="featherUserPlus"/>
                                שיתוף
                            </button>
                        } @else {
                            <button type="button" class="btn btn-secondary btn-sm shrink-0" (click)="share(row.calendar)">חברים</button>
                        }
                    </div>

                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-3 ps-5">
                        <button type="button"
                                class="flex items-center gap-1.5 rounded-sm text-caption text-writing-minor hover:text-writing transition-colors"
                                [attr.aria-pressed]="!row.calendar.hide_from_upcoming"
                                (click)="toggleShowInUpcoming(row.calendar)">
                            <span class="size-4 rounded border flex items-center justify-center shrink-0 {{ row.calendar.hide_from_upcoming ? 'bg-layer-2 border-layer-4' : 'bg-accent border-accent text-on-accent' }}">
                                @if (!row.calendar.hide_from_upcoming) {
                                    <ng-icon [svg]="featherCheck" class="h-2.5 w-2.5"></ng-icon>
                                }
                            </span>
                            הצגה באירועים הקרובים
                        </button>
                        <button type="button" class="rounded-sm text-caption text-writing-minor hover:text-writing transition-colors" (click)="moveInto(row.calendar)">
                            העברת אירועים לכאן
                        </button>
                        <span class="flex-1"></span>
                        @if (row.calendar.is_owner) {
                            <button type="button" class="icon-btn" aria-label="שינוי שם" title="שינוי שם" (click)="rename(row.calendar)">
                                <ng-icon [svg]="featherEdit2"/>
                            </button>
                            @if (row.canDelete) {
                                <button type="button" class="icon-btn icon-btn-danger" aria-label="מחיקת הלוח" title="מחיקת הלוח" (click)="deleteCalendar(row.calendar)">
                                    <ng-icon [svg]="featherTrash2"/>
                                </button>
                            }
                        } @else {
                            <button type="button" class="icon-btn icon-btn-danger" aria-label="יציאה מהלוח" title="יציאה מהלוח" (click)="leave(row.calendar)">
                                <ng-icon [svg]="featherLogOut"/>
                            </button>
                        }
                    </div>
                </div>
            }
        </div>

        <button type="button" class="btn btn-secondary w-full mt-4" (click)="createCalendar()">
            <ng-icon [svg]="featherPlus"/>
            לוח חדש
        </button>
    }
</div>
