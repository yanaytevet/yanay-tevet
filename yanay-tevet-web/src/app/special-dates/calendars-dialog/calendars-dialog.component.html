<div class="dialog-container w-full max-h-[90vh] overflow-y-auto">

    <div class="flex items-start justify-between mb-5">
        <h2 class="text-section font-bold text-writing">{{ t().calendars.title }}</h2>
        <button type="button" class="icon-btn -me-1.5 -mt-1" [attr.aria-label]="t().close" (click)="onClose()">
            <ng-icon [svg]="featherX" class="text-heading"/>
        </button>
    </div>

    @if (isLoading()) {
        <app-loading-state [label]="t().loading"/>
    } @else {
        <div class="flex flex-col gap-3">
            @for (row of rows(); track row.calendar.id) {
                <div class="rounded-lg border border-line p-3 {{ row.colorClass }}">
                    <div class="flex items-center gap-2">
                        <span class="calendar-dot size-3 rounded-full shrink-0"></span>
                        <div class="flex-1 min-w-0">
                            <div class="text-ui font-semibold text-writing truncate" dir="auto">{{ row.calendar.name }}</div>
                            <div class="text-caption text-writing-minor truncate">{{ row.subtitle }}</div>
                        </div>
                        @if (row.calendar.is_owner) {
                            <button type="button" class="btn btn-primary btn-sm shrink-0" (click)="share(row.calendar)">
                                <ng-icon [svg]="featherUserPlus"/>
                                {{ t().calendars.share }}
                            </button>
                        } @else {
                            <button type="button" class="btn btn-secondary btn-sm shrink-0" (click)="share(row.calendar)">{{ t().calendars.members }}</button>
                        }
                    </div>

                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-3 ps-5">
                        <button type="button"
                                class="flex items-center gap-1.5 rounded-sm text-caption text-writing-minor hover:text-writing transition-colors"
                                [attr.aria-pressed]="!row.calendar.hide_from_upcoming"
                                (click)="toggleShowInUpcoming(row.calendar)">
                            <app-checkbox-mark [checked]="!row.calendar.hide_from_upcoming" size="sm"/>
                            {{ t().calendars.showInUpcoming }}
                        </button>
                        <button type="button" class="rounded-sm text-caption text-writing-minor hover:text-writing transition-colors" (click)="moveInto(row.calendar)">
                            {{ t().calendars.moveHere }}
                        </button>
                        <span class="flex-1"></span>
                        @if (row.calendar.is_owner) {
                            <button type="button" class="icon-btn" [attr.aria-label]="t().calendars.rename" [title]="t().calendars.rename" (click)="rename(row.calendar)">
                                <ng-icon [svg]="featherEdit"/>
                            </button>
                            @if (row.canDelete) {
                                <button type="button" class="icon-btn icon-btn-danger" [attr.aria-label]="t().calendars.deleteCalendar" [title]="t().calendars.deleteCalendar" (click)="deleteCalendar(row.calendar)">
                                    <ng-icon [svg]="featherTrash2"/>
                                </button>
                            }
                        } @else {
                            <button type="button" class="icon-btn icon-btn-danger" [attr.aria-label]="t().calendars.leave" [title]="t().calendars.leave" (click)="leave(row.calendar)">
                                <ng-icon [svg]="featherLogOut" class="rtl:-scale-x-100"/>
                            </button>
                        }
                    </div>
                </div>
            }
        </div>

        <button type="button" class="btn btn-secondary w-full mt-4" (click)="createCalendar()">
            <ng-icon [svg]="featherPlus"/>
            {{ t().newCalendar }}
        </button>
    }
</div>
