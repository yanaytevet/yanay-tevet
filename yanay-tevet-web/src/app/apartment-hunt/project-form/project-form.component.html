<div class="page-wide">

    <a [routerLink]="backUrl()"
       class="inline-flex items-center gap-1.5 rounded-md text-meta text-writing-minor no-underline hover:text-writing transition-colors mb-4">
        <ng-icon [svg]="featherArrowLeft" class="rtl:-scale-x-100"/>
        {{ t().common.back }}
    </a>

    <app-page-header [title]="isEditMode() ? t().projectForm.editTitle : t().projectForm.newTitle"
                     [subtitle]="t().projectForm.subtitle"/>

    @if (isLoading()) {
        <app-loading-state [label]="t().projectForm.loading"/>
    } @else if (loadError()) {
        <app-error-state [text]="t().common.loadProjectError" [backUrl]="backUrl()" [backLabel]="t().common.back"/>
    } @else {
        <div class="card p-5 sm:p-6">
            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">{{ t().projectForm.name }} <span class="text-writing-least">*</span></span>
                <input type="text" dir="auto" class="main-input" [placeholder]="t().projectForm.namePlaceholder"
                       [attr.aria-label]="t().projectForm.name"
                       [formControl]="nameCtrl"/>
            </div>

            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">{{ t().projectForm.description }}</span>
                <textarea dir="auto" class="main-input leading-relaxed" rows="4"
                          [attr.aria-label]="t().projectForm.description"
                          [placeholder]="t().projectForm.descriptionPlaceholder"
                          [formControl]="descriptionCtrl"></textarea>
            </div>

            <div class="flex flex-col gap-1.5">
                <span class="input-label">{{ t().projectForm.currency }}</span>
                <select class="main-input sm:w-auto" [attr.aria-label]="t().projectForm.currency" [formControl]="currencyCtrl">
                    @for (currency of currencyOptions; track currency) {
                        <option [value]="currency">{{ t().currencies[currency] }}</option>
                    }
                </select>
            </div>

            <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-line-subtle">
                <button type="button" class="btn btn-secondary" [disabled]="isSaving()" (click)="onCancel()">{{ t().common.cancel }}</button>
                <button type="button" class="btn btn-primary" [disabled]="!canSave()" (click)="onSave()">
                    {{ isSaving() ? t().common.saving : (isEditMode() ? t().common.saveChanges : t().projectForm.create) }}
                </button>
            </div>
        </div>
    }
</div>
