<div class="page-narrow">

    <app-page-header title="Workout Plan" subtitle="Group your exercises into routines and keep your sets up to date.">
        <button type="button" class="btn btn-primary" (click)="createRoutine()">
            <ng-icon [svg]="featherPlus"/>
            New routine
        </button>
    </app-page-header>

    @if (isLoading()) {
        <app-loading-state label="Loading routines"/>
    } @else if (routines().length === 0) {
        <app-empty-state title="Build your first routine"
                         text="Start with something like Push Day, then add the exercises and sets you train.">
            <button type="button" class="btn btn-primary" (click)="createRoutine()">
                <ng-icon [svg]="featherPlus"/>
                New routine
            </button>
        </app-empty-state>
    } @else {
        <div class="grid grid-cols-1 @md:grid-cols-2 gap-3">
            @for (routine of routines(); track routine.id) {
                <a [routerLink]="routineUrls()[routine.id]" class="card card-interactive p-4 flex flex-col">
                    <div class="text-ui font-semibold text-writing truncate mb-2" dir="auto">{{ routine.name }}</div>
                    <div class="text-caption text-writing-minor">
                        {{ routine.exercise_count }} exercise{{ routine.exercise_count === 1 ? '' : 's' }}
                    </div>
                </a>
            }
        </div>
    }
</div>
