<div class="dialog-container w-full">

    <div class="flex items-start justify-between mb-1">
        <h2 class="text-section font-bold text-writing">{{ t().bookingDialog.title }}</h2>
        <button type="button" class="icon-btn -me-1.5 -mt-1" [attr.aria-label]="t().common.close" (click)="onClose()">
            <ng-icon [svg]="featherX" class="text-xl"/>
        </button>
    </div>
    <p class="text-meta text-writing-minor mb-5">{{ t().bookingDialog.intro }}</p>

    <div class="flex gap-3 mb-4">
        <div class="flex-1 flex flex-col gap-1.5">
            <span class="input-label">{{ t().bookingDialog.checkIn }}</span>
            <input type="date" class="main-input w-full" [formControl]="startCtrl" />
        </div>
        <div class="flex-1 flex flex-col gap-1.5">
            <span class="input-label">{{ t().bookingDialog.checkOut }}</span>
            <input type="date" class="main-input w-full" [formControl]="endCtrl" />
        </div>
    </div>

    @if (showBookFor) {
        <div class="flex flex-col gap-1.5 mb-4">
            <span class="input-label">{{ t().bookingDialog.bookingFor }}</span>
            <select class="main-input w-full" [formControl]="bookForCtrl">
                @for (option of bookForOptions(); track option.id) {
                    <option [ngValue]="option.id">{{ option.name }}</option>
                }
            </select>
        </div>
    }

    <div class="flex flex-col gap-1.5 mb-4">
        <span class="input-label">{{ t().bookingDialog.note }}</span>
        <textarea class="main-input w-full" rows="2" dir="auto"
                  [placeholder]="t().bookingDialog.notePlaceholder" [formControl]="noteCtrl"></textarea>
    </div>

    @if (errorMsg()) {
        <p class="text-caption text-danger mb-4">{{ errorMsg() }}</p>
    }

    <div class="flex justify-end gap-2">
        <button type="button" class="btn btn-secondary" (click)="onClose()">{{ t().common.cancel }}</button>
        <button type="button" class="btn btn-primary" [disabled]="isBooking() || errorMsg() !== null" (click)="onBook()">{{ t().bookingDialog.book }}</button>
    </div>
</div>
