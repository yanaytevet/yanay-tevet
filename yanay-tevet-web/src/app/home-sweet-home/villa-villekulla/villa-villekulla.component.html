<div class="page-wide">

    <app-page-header [title]="t().list.title" [subtitle]="t().list.subtitle">
        @if (isSiteAdmin()) {
            <button type="button" class="btn btn-primary" (click)="createProject()">
                <ng-icon [svg]="featherPlus"/>
                {{ t().list.newProperty }}
            </button>
        }
    </app-page-header>

    @if (isLoading()) {
        <app-loading-state [label]="t().list.loading"/>
    } @else if (projects().length === 0) {
        @if (isSiteAdmin()) {
            <app-empty-state [title]="t().list.emptyAdminTitle"
                             [text]="t().list.emptyAdminText">
                <button type="button" class="btn btn-primary" (click)="createProject()">
                    <ng-icon [svg]="featherPlus"/>
                    {{ t().list.newProperty }}
                </button>
            </app-empty-state>
        } @else {
            <app-empty-state [title]="t().list.emptyGuestTitle"
                             [text]="t().list.emptyGuestText"/>
        }
    } @else {
        <div class="grid grid-cols-1 @md:grid-cols-2 gap-3">
            @for (project of projects(); track project.id) {
                <a [routerLink]="projectUrls()[project.id]"
                   class="card card-interactive p-4 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <div class="text-ui font-semibold text-writing truncate" dir="auto">{{ project.name }}</div>
                        @if (project.description) {
                            <div class="text-meta text-writing-minor truncate" dir="auto">{{ project.description }}</div>
                        }
                    </div>
                    <ng-icon [svg]="featherChevronRight" class="text-xl text-writing-least shrink-0 rtl:-scale-x-100" aria-hidden="true"/>
                </a>
            }
        </div>
    }
</div>
