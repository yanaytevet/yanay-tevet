<div class="page-wide">

    <app-page-header title="Villa Villekulla" subtitle="Properties you can book.">
        @if (isSiteAdmin()) {
            <button type="button" class="btn btn-primary" (click)="createProject()">
                <ng-icon [svg]="featherPlus"/>
                New property
            </button>
        }
    </app-page-header>

    @if (isLoading()) {
        <app-loading-state label="Loading properties"/>
    } @else if (projects().length === 0) {
        @if (isSiteAdmin()) {
            <app-empty-state title="Create your first property"
                             text="Add a property, then invite friends to book its unit.">
                <button type="button" class="btn btn-primary" (click)="createProject()">
                    <ng-icon [svg]="featherPlus"/>
                    New property
                </button>
            </app-empty-state>
        } @else {
            <app-empty-state title="Ask the host for an invite"
                             text="Once the host invites you, the property's booking calendar shows up here."/>
        }
    } @else {
        <div class="grid grid-cols-1 @md:grid-cols-2 gap-3">
            @for (project of projects(); track project.id) {
                <a [routerLink]="projectUrls()[project.id]"
                   class="card card-interactive p-4 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <div class="text-ui font-semibold text-writing truncate" dir="auto">{{ project.name }}</div>
                        @if (project.description) {
                            <div class="text-meta text-writing-minor truncate" dir="auto">{{ project.description }}</div>
                        }
                    </div>
                    <ng-icon [svg]="featherChevronRight" class="text-xl text-writing-least shrink-0" aria-hidden="true"/>
                </a>
            }
        </div>
    }
</div>
