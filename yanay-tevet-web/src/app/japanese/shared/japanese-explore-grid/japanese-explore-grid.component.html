<div>
  <div class="flex items-center justify-end mb-3">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="shuffle()"
      [disabled]="isLoading()">
      Shuffle
    </button>
  </div>

  @if (error(); as err) {
    <div class="rounded-xl p-4 mb-4 text-body text-danger bg-danger-soft">{{ err }}</div>
  }

  @if (nodes().length === 0) {
    @if (isLoading()) {
      <app-loading-state/>
    } @else if (!error()) {
      <app-empty-state [title]="emptyTitle()" text="Ingested text and the entities generated from it show up here."/>
    }
  }

  <div class="grid grid-cols-1 @md:grid-cols-2 gap-3">
    @for (node of nodes(); track node.id) {
      <app-node-summary-card [node]="node"/>
    }
  </div>
</div>
