  @if (isLoading() && stubs().length === 0) {
    <app-loading-state label="Loading review queue"/>
  } @else if (error(); as err) {
    <app-error-state [text]="err"/>
  } @else {
    <div class="text-section font-semibold text-writing mb-3">
      Stubs <span class="text-writing-minor text-body font-normal">({{ stubs().length }})</span>
    </div>
    @if (stubs().length === 0) {
      <app-empty-state title="No stubs waiting for content"
                       text="Ingested text waits here until its content is generated."/>
    } @else {
      <div class="grid grid-cols-1 @md:grid-cols-2 gap-3">
        @for (node of stubs(); track node.id) {
          <app-node-summary-card [node]="node" [showStatus]="true"/>
        }
      </div>
    }
  }
</div>
