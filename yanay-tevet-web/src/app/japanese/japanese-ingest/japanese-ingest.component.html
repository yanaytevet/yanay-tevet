<app-japanese-nav/>

<div class="page-wide">
  <app-page-header title="Ingest"
                   subtitle="Add a word, kanji, particle, grammar rule, a single sentence, or a whole passage (a song, poem, or paragraph)."/>

  <div class="card p-5 sm:p-6">
    <span class="input-label mb-1.5">Japanese text</span>
    <textarea
      dir="auto"
      class="main-input"
      rows="4"
      aria-label="Japanese text"
      placeholder="例: 私(わたし)は寿司(すし)を食(た)べた。"
      [ngModel]="text()"
      (ngModelChange)="text.set($event)"
      [disabled]="isWorking()"></textarea>
    <p class="text-caption text-writing-minor mt-1.5">
      The backend classifies it and creates a stub. Content and linked entities are generated in a separate step
      from the node page. Tip: include furigana inline as 漢字(かんじ).
    </p>

    <div class="flex justify-end mt-4">
      <button
        type="button"
        class="btn btn-primary"
        (click)="onSubmit()"
        [disabled]="!canSubmit()">
        @if (isWorking()) { Ingesting… } @else { Ingest }
      </button>
    </div>
  </div>
</div>
