<div class="page-narrow">

    <a [routerLink]="backUrl"
       class="inline-flex items-center gap-1.5 rounded-md text-meta text-writing-minor no-underline hover:text-writing transition-colors mb-4">
        <ng-icon [svg]="featherArrowLeft" class="rtl:-scale-x-100"/>
        {{ t().form.backToDiary }}
    </a>

    <app-page-header [title]="isEditMode() ? t().form.editTitle : t().form.newTitle"
                     [subtitle]="isEditMode() ? t().form.editSubtitle : t().form.newSubtitle"/>

    @if (isLoading()) {
        <app-loading-state [label]="t().form.loadingDream"/>
    } @else if (loadFailed()) {
        <app-error-state [text]="t().form.loadFailed" [backUrl]="backUrl" [backLabel]="t().form.backToDiary"/>
    } @else {
        <div class="card p-5 sm:p-6">

            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">{{ t().form.dream }} <span class="text-writing-least">*</span></span>
                <textarea
                    dir="auto"
                    class="main-input leading-relaxed"
                    [attr.aria-label]="t().form.dream"
                    [placeholder]="t().form.dreamPlaceholder"
                    rows="12"
                    [formControl]="textCtrl"></textarea>
            </div>

            <div class="flex flex-col gap-1.5">
                <span class="input-label">{{ t().form.dateTime }}</span>
                <input
                    type="datetime-local"
                    dir="auto"
                    class="main-input sm:w-auto"
                    [attr.aria-label]="t().form.dateTimeAria"
                    [formControl]="timeCtrl" />
            </div>

            <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-line-subtle">
                <button type="button"
                        class="btn btn-secondary"
                        [disabled]="isSaving()"
                        (click)="onCancel()">
                    {{ t().cancel }}
                </button>
                <button type="button"
                        class="btn btn-primary"
                        [disabled]="!canSave()"
                        (click)="onSave()">
                    @if (isSaving()) {
                        {{ isEditMode() ? t().form.savingEdit : t().form.savingNew }}
                    } @else {
                        {{ isEditMode() ? t().form.saveChanges : t().form.saveDream }}
                    }
                </button>
            </div>
        </div>
    }
</div>
