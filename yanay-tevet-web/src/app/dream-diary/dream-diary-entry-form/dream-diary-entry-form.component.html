<div class="page-narrow">

    <a [routerLink]="backUrl"
       class="inline-flex items-center gap-1.5 rounded-md text-meta text-writing-minor no-underline hover:text-writing transition-colors mb-4">
        <ng-icon [svg]="featherArrowLeft"/>
        Back to diary
    </a>

    <app-page-header [title]="isEditMode() ? 'Edit dream' : 'New dream'"
                     [subtitle]="isEditMode() ? 'Update the details of this dream.' : 'Capture it before it fades.'"/>

    @if (isLoading()) {
        <app-loading-state label="Loading dream"/>
    } @else if (loadError()) {
        <app-error-state [text]="loadError()!" [backUrl]="backUrl" backLabel="Back to diary"/>
    } @else {
        <div class="card p-5 sm:p-6">

            <div class="mb-5 flex flex-col gap-1.5">
                <span class="input-label">Dream <span class="text-writing-least">*</span></span>
                <textarea
                    dir="auto"
                    class="main-input leading-relaxed"
                    aria-label="Dream"
                    placeholder="Describe your dream in as much detail as you can remember..."
                    rows="12"
                    [formControl]="textCtrl"></textarea>
            </div>

            <div class="flex flex-col gap-1.5">
                <span class="input-label">Date & Time</span>
                <input
                    type="datetime-local"
                    dir="auto"
                    class="main-input sm:w-auto"
                    aria-label="Date and time"
                    [formControl]="timeCtrl" />
            </div>

            <div class="flex items-center justify-end gap-2 mt-6 pt-4 border-t border-line-subtle">
                <button type="button"
                        class="btn btn-secondary"
                        [disabled]="isSaving()"
                        (click)="onCancel()">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        [disabled]="!canSave()"
                        (click)="onSave()">
                    @if (isSaving()) {
                        {{ isEditMode() ? 'Blaming your mother...' : 'Consulting Freud...' }}
                    } @else {
                        {{ isEditMode() ? 'Save Changes' : 'Save Dream' }}
                    }
                </button>
            </div>
        </div>
    }
</div>
