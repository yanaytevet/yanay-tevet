<div class="flex flex-col min-w-0">
  <div class="relative">
    @if (canScrollLeft()) {
      <div class="absolute left-0 top-0 bottom-px z-10 w-12 flex items-center justify-start bg-gradient-to-r from-layer-1 to-transparent pointer-events-none">
        <button type="button" class="icon-btn pointer-events-auto" aria-label="Scroll tabs left" (click)="scroll('left')">
          <ng-icon [svg]="featherChevronLeft"/>
        </button>
      </div>
    }

    <div #scrollContainer
         (scroll)="checkScroll()"
         role="tablist"
         class="flex gap-1 border-b border-line overflow-x-auto overflow-y-hidden no-scrollbar">
      @for (tab of tabs(); track tab.name()) {
        @if (tab.link()) {
          <a [routerLink]="tab.link()"
             routerLinkActive="!text-writing !border-accent"
             class="shrink-0 whitespace-nowrap flex items-center gap-2 px-3 py-2 -mb-px border-b-2 border-transparent rounded-t-md text-body font-medium text-writing-minor hover:text-writing transition-colors no-underline">
            @if (tab.icon()) {
              <ng-icon [svg]="tab.icon()" aria-hidden="true"/>
            }
            {{ tab.label() }}
          </a>
        } @else {
          <button type="button" role="tab"
                  class="shrink-0 whitespace-nowrap flex items-center gap-2 px-3 py-2 -mb-px border-b-2 rounded-t-md text-body font-medium hover:text-writing transition-colors"
                  [class.border-accent]="isCurrent()[tab.name()]"
                  [class.text-writing]="isCurrent()[tab.name()]"
                  [class.border-transparent]="!isCurrent()[tab.name()]"
                  [class.text-writing-minor]="!isCurrent()[tab.name()]"
                  [attr.aria-selected]="isCurrent()[tab.name()]"
                  (click)="tabClicked(tab)">
            @if (tab.icon()) {
              <ng-icon [svg]="tab.icon()" aria-hidden="true"/>
            }
            {{ tab.label() }}
          </button>
        }
      }
    </div>

    @if (canScrollRight()) {
      <div class="absolute right-0 top-0 bottom-px z-10 w-12 flex items-center justify-end bg-gradient-to-l from-layer-1 to-transparent pointer-events-none">
        <button type="button" class="icon-btn pointer-events-auto" aria-label="Scroll tabs right" (click)="scroll('right')">
          <ng-icon [svg]="featherChevronRight"/>
        </button>
      </div>
    }
  </div>
  <div class="pt-4" role="tabpanel">
    @if (currentTab()) {
      <ng-container [ngTemplateOutlet]="currentTab()!.contentTpl()"></ng-container>
    }
  </div>
</div>
