<div
        (click)="onClick()"
        class="transition-colors duration-150 flex items-center px-4 py-2 border rounded-md cursor-pointer"
        [class]="isSelected() ? 'bg-accent text-on-accent border-accent' : 'bg-layer-2 hover:bg-layer-overlay border-line'"
>
    <div class="flex-grow min-w-0 overflow-hidden text-ellipsis whitespace-nowrap">{{ text() }}</div>
    <div class="flex-shrink-0 ml-2">
        @if (isSelected()) {
            <ng-icon [svg]="checkIcon" class="h-5 w-5"></ng-icon>
        }
    </div>
</div>
