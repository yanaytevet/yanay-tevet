<button type="button" [cdkMenuTriggerFor]="menu" class="icon-btn gap-1.5" [attr.aria-label]="text() ? null : ariaLabel()">
  @if (icon()) {
    <ng-icon [svg]="icon()"></ng-icon>
  }
  @if (text()) {
    <span class="font-medium text-body">{{ text() }}</span>
  }
</button>

<ng-template #menu>
  <div cdkMenu class="min-w-40 py-1 bg-layer-2 rounded-lg border border-line shadow-2">
    @for (action of actions(); track $index) {
      @if (action === SEPARATOR) {
        <div class="h-px my-1 mx-3 bg-line"></div>
      } @else {
        <button cdkMenuItem
                (click)="action.callback()"
                [disabled]="action.disabled"
                class="w-full flex items-center gap-2 px-3 py-2 text-start text-body hover:bg-layer-overlay transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
                [class.text-writing]="!action.danger"
                [class.text-danger]="action.danger">
          @if (action.icon) {
            <ng-icon [svg]="action.icon" size="14" class="shrink-0" [class.text-writing-minor]="!action.danger"></ng-icon>
          }
          <span>{{ action.display }}</span>
        </button>
      }
    }
  </div>
</ng-template>
