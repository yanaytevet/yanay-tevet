<div class="dialog-container">
    <h2>{{ data.title }}</h2>
    <p>{{ data.text }}</p>

    <form [formGroup]="form">
        <div class="mb-4 flex flex-col">
            <span class="input-label">Type "{{ data.validationText }}" below to confirm</span>
            <input
                    type="text"
                    dir="auto"
                    formControlName="inputValue"
                    class="w-full main-input mt-2"
                    (keydown.enter)="onConfirm()"
            >
        </div>
    </form>

    <div class="dialog-buttons-container">
        <button class="btn btn-secondary" (click)="onCancel()">
            {{ data.cancelActionName ?? 'Cancel' }}
        </button>
        <!-- Typing the phrase is how every irreversible delete is confirmed, so this is always the danger button. -->
        <button class="btn btn-danger" [disabled]="form.invalid" (click)="onConfirm()">
            {{ data.confirmActionName ?? 'Confirm' }}
        </button>
    </div>
</div>
