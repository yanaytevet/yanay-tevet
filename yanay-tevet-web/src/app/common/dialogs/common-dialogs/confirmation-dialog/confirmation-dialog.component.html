<div class="dialog-container">
    <h2>{{ data.title }}</h2>
    <p>{{ data.text }}</p>
    <div class="dialog-buttons-container">
        <button class="btn btn-secondary" (click)="emitClose(false)">{{ data.cancelActionName ?? t().cancel }}</button>
        <button class="btn" [class.btn-danger]="data.danger" [class.btn-primary]="!data.danger" (click)="emitClose(true)">
            {{ data.confirmActionName ?? t().confirm }}
        </button>
    </div>
</div>
